# Drovie Downloader — container configuration.
#
# The container copies this file to /config/.putio_config on its first start.
# Every line falls back to the container's environment, so settings in your
# compose file or .env keep working; edit a line here to pin a value instead.
# `drovie-downloader config set KEY VALUE` edits this file for you.
#
# The file is bash, sourced by the processor: keep it to plain assignments.

# --- put.io ----------------------------------------------------------------
# The rclone remote and folder to download from. The container builds the
# "putio" remote from PUTIO_TOKEN at start. Use the folder Drovie sends
# transfers to (Drovie › Settings › Download client › put.io; "Use a Drovie
# folder" there sets it to Drovie). Everything
# downloaded from it is deleted from put.io afterwards.
REMOTE="${REMOTE:-putio:Drovie/}"
DELETE_AFTER_DOWNLOAD="${DELETE_AFTER_DOWNLOAD:-true}"

# --- Paths inside the container --------------------------------------------
# Mount your Plex library folders at /media/Movies and /media/TV (or point
# these elsewhere). Files land in LOCAL_DIR first and are then moved into the
# library, so LOCAL_DIR needs room for the largest download.
LOCAL_DIR="${LOCAL_DIR:-/downloads}"
MOVIE_LIBRARY="${MOVIE_LIBRARY:-/media/Movies}"
TV_LIBRARY="${TV_LIBRARY:-/media/TV}"
UNMATCHED_DIR="${UNMATCHED_DIR:-/media/Unmatched}"
# Staging protects transfers from a network share that drops mid-download by
# landing them on local disk first. Off by default: in a container /downloads
# is usually the same disk, and staging would only copy each file twice.
USE_TEMP_DIR="${USE_TEMP_DIR:-false}"
STAGING_DIR="${STAGING_DIR:-/downloads/.staging}"
MIN_FREE_SPACE_GB="${MIN_FREE_SPACE_GB:-5}"

# --- TMDb (required) -------------------------------------------------------
# Identifies each download so it is filed under the right title. The same
# key Drovie uses works: https://www.themoviedb.org/settings/api
TMDB_API_KEY="${TMDB_API_KEY:-}"

# --- Plex (required) -------------------------------------------------------
# Scanned after new files are filed. host.docker.internal reaches a Plex on
# the Docker host (the compose files map it). Library ids are discovered when
# left empty.
PLEX_URL="${PLEX_URL:-http://host.docker.internal:32400}"
PLEX_TOKEN="${PLEX_TOKEN:-}"
PLEX_MOVIE_LIBRARY_ID="${PLEX_MOVIE_LIBRARY_ID:-}"
PLEX_TV_LIBRARY_ID="${PLEX_TV_LIBRARY_ID:-}"

# --- Drovie webhook (optional) ---------------------------------------------
# Lets Drovie mark requests available right after a scan instead of at its
# next check. URL: Drovie's address + /api/webhooks/plex-check. Key: Drovie ›
# Settings › Plex › Instant updates › Webhook key.
DROVIE_WEBHOOK_URL="${DROVIE_WEBHOOK_URL:-}"
DROVIE_WEBHOOK_KEY="${DROVIE_WEBHOOK_KEY:-}"

# --- State and logs (on the /config volume) --------------------------------
LOG_FILE="${LOG_FILE:-/config/logs/drovie-downloader.log}"
LOG_LEVEL="${LOG_LEVEL:-INFO}"
PAUSE_FILE="${PAUSE_FILE:-/config/paused}"
LOCKFILE="${LOCKFILE:-/tmp/drovie-downloader.lock}"
PROGRESS_STATE_DIR="${PROGRESS_STATE_DIR-/tmp/drovie-downloader-progress}"
RCLONE_STATS_INTERVAL="${RCLONE_STATS_INTERVAL:-5s}"

# --- Transfer tuning -------------------------------------------------------
RCLONE_TRANSFERS="${RCLONE_TRANSFERS:-4}"
RCLONE_CHECKERS="${RCLONE_CHECKERS:-8}"
RCLONE_BUFFER_SIZE="${RCLONE_BUFFER_SIZE:-64M}"
RCLONE_MULTI_THREADS="${RCLONE_MULTI_THREADS:-2}"
RCLONE_MAX_CONCURRENT="${RCLONE_MAX_CONCURRENT:-1}"
RCLONE_BWLIMIT="${RCLONE_BWLIMIT:-off}"
MAX_RETRIES="${MAX_RETRIES:-3}"
RETRY_DELAY="${RETRY_DELAY:-5}"

# --- TMDb rate limit -------------------------------------------------------
MAX_REQUESTS_PER_WINDOW="${MAX_REQUESTS_PER_WINDOW:-35}"
RATE_WINDOW_SECONDS="${RATE_WINDOW_SECONDS:-10}"
RATE_LIMIT_DELAY="${RATE_LIMIT_DELAY:-1}"
